name: deploy

on:
  workflow_dispatch:
    inputs:
      environment_profile:
        description: "Environment profile (poc or prod)"
        required: true
        default: "poc"
        type: choice
        options:
          - poc
          - prod

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate repository
        run: scripts/test/validate.sh

  whatif:
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_profile }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Azure Login (OIDC)
        uses: azure/login@718491048c7421e7840f2ec36345bc913f3b3570 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: What-if Bicep deployment
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          ENVIRONMENT_PROFILE: ${{ inputs.environment_profile }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          APIM_NAME: ${{ vars.APIM_NAME }}
          APIM_PUBLISHER_EMAIL: ${{ vars.APIM_PUBLISHER_EMAIL }}
          APIM_PUBLISHER_NAME: ${{ vars.APIM_PUBLISHER_NAME }}
          FOUNDRY_BASE_URL: ${{ vars.FOUNDRY_BASE_URL }}
          APIM_EXPECTED_AUDIENCE: ${{ vars.APIM_EXPECTED_AUDIENCE }}
          APIM_REQUIRED_APP_ROLE: ${{ vars.APIM_REQUIRED_APP_ROLE }}
          PER_USER_RATE_LIMIT: ${{ vars.PER_USER_RATE_LIMIT }}
          PER_USER_HOURLY_QUOTA: ${{ vars.PER_USER_HOURLY_QUOTA }}
          PER_USER_TOKEN_LIMIT: ${{ vars.PER_USER_TOKEN_LIMIT }}
        run: |
          case "${ENVIRONMENT_PROFILE}" in
            poc|prod) ;;
            *) echo "Unsupported environment profile" >&2; exit 1 ;;
          esac
          az deployment group what-if \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --template-file infra/main.bicep \
            --parameters "infra/params/${ENVIRONMENT_PROFILE}.bicepparam"
