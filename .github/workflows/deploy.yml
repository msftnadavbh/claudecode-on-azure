name: deploy

on:
  workflow_dispatch:
    inputs:
      environment_profile:
        description: "Environment profile (poc or prod)"
        required: true
        default: "poc"

permissions:
  id-token: write
  contents: read

jobs:
  whatif:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_profile }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: What-if Bicep deployment
        uses: azure/cli@v2
        with:
          inlineScript: |
            az deployment group what-if \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --template-file infra/main.bicep \
              --parameters "infra/params/${{ inputs.environment_profile }}.bicepparam"
